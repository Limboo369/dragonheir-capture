name: Build Windows exe

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests (read real screenshots)
        run: python -m tests.test_screens
      - name: Smoke test window
        run: python -m tests.smoke_gui
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --uac-admin --name DragonheirReader --collect-data customtkinter --collect-all rapidocr_onnxruntime --add-data "dhreader\data;dhreader\data" DragonheirReader.py
      - name: Test the exe starts
        run: python -m tests.exe_check dist\DragonheirReader.exe
      - uses: actions/upload-artifact@v4
        with:
          name: DragonheirReader
          path: dist/DragonheirReader.exe
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dragonheir Reader (latest)
          make_latest: true
          files: dist/DragonheirReader.exe

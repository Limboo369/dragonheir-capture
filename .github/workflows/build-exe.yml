name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Smoke test
        run: python -c "import dhcapture.gui, dhcapture.winlist as w; print(len(w.list_windows()), 'windows')"
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name DragonheirCapture --add-data "dhcapture\known_names.json;dhcapture" dhcapture\__main__.py
      - uses: actions/upload-artifact@v4
        with:
          name: DragonheirCapture
          path: |
            dist/DragonheirCapture.exe
            .env.example
      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Dragonheir Capture (latest)
          make_latest: true
          files: |
            dist/DragonheirCapture.exe
            .env.example
